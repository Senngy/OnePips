<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Obsidian Pulse Admin | Terminal Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#464556",
                    "tertiary-fixed": "#ffdad7",
                    "surface-container": "#1f1f23",
                    "inverse-surface": "#e4e1e7",
                    "inverse-primary": "#732ee4",
                    "tertiary": "#ffb3ad",
                    "secondary-fixed": "#e3e0f5",
                    "on-secondary": "#2f2f3f",
                    "primary-fixed-dim": "#d2bbff",
                    "on-primary-fixed": "#25005a",
                    "on-primary-fixed-variant": "#5a00c6",
                    "surface": "#131317",
                    "surface-bright": "#39393d",
                    "surface-container-low": "#1b1b1f",
                    "error": "#ffb4ab",
                    "on-tertiary": "#68000a",
                    "on-primary": "#3f008e",
                    "primary-fixed": "#eaddff",
                    "surface-container-lowest": "#0e0e12",
                    "secondary": "#c7c4d9",
                    "on-surface-variant": "#ccc3d8",
                    "error-container": "#93000a",
                    "on-error": "#690005",
                    "primary-container": "#7c3aed",
                    "surface-container-high": "#2a292e",
                    "surface-container-highest": "#353439",
                    "surface-tint": "#d2bbff",
                    "surface-dim": "#131317",
                    "on-primary-container": "#ede0ff",
                    "secondary-container": "#464556",
                    "inverse-on-surface": "#303034",
                    "secondary-fixed-dim": "#c7c4d9",
                    "on-secondary-container": "#b5b3c7",
                    "on-tertiary-fixed-variant": "#930013",
                    "surface-variant": "#353439",
                    "background": "#131317",
                    "on-tertiary-fixed": "#410004",
                    "on-surface": "#e4e1e7",
                    "on-error-container": "#ffdad6",
                    "primary": "#d2bbff",
                    "on-tertiary-container": "#ffdfdc",
                    "on-background": "#e4e1e7",
                    "outline-variant": "#4a4455",
                    "on-secondary-fixed": "#1a1a29",
                    "tertiary-fixed-dim": "#ffb3ad",
                    "outline": "#958da1",
                    "tertiary-container": "#c6252b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "display": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0b0b0f;
            color: #e4e1e7;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .bg-grid {
            background-image: 
                linear-gradient(to right, rgba(74, 68, 85, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(74, 68, 85, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow-pulse {
            box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); }
            100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
        }

        .terminal-scanner {
            position: absolute;
            height: 2px;
            width: 100%;
            background: linear-gradient(to right, transparent, #7c3aed, transparent);
            top: 0;
            left: 0;
            opacity: 0.3;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .glass-panel {
            background: rgba(31, 31, 35, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 68, 85, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
<!-- Background Elements -->
<div class="absolute inset-0 bg-grid z-0"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Decorative Floating Shapes -->
<div class="absolute top-10 right-10 w-64 h-64 border border-outline-variant/10 rounded-full animate-[spin_60s_linear_infinite]"></div>
<div class="absolute bottom-10 left-10 w-96 h-96 border border-outline-variant/5 rounded-full animate-[spin_80s_linear_infinite]"></div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-md px-6">
<!-- Brand Header -->
<div class="text-center mb-12 space-y-2">
<div class="inline-flex items-center gap-3 mb-4">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center shadow-[0_0_20px_rgba(124,58,237,0.4)]">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
<h1 class="font-headline text-2xl font-bold tracking-tighter text-on-surface">
                    One Pips Admin <span class="text-primary font-light opacity-50 ml-1">/ Obsidian Pulse</span>
</h1>
</div>
<div class="h-[1px] w-12 bg-primary-container mx-auto mb-6"></div>
<h2 class="font-headline text-3xl font-bold text-on-surface tracking-tight">Accès Terminal</h2>
<p class="text-outline text-sm font-body max-w-[280px] mx-auto leading-relaxed">Authentification sécurisée requise pour les opérateurs Elite.</p>
</div>
<!-- Login Card -->
<div class="glass-panel p-8 rounded-xl relative overflow-hidden group">
<div class="terminal-scanner pointer-events-none"></div>
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] font-label uppercase tracking-[0.2em] text-outline font-bold ml-1">Identifiant Opérateur</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-md py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-300 font-body text-sm" placeholder="admin@onepips.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block text-[10px] font-label uppercase tracking-[0.2em] text-outline font-bold ml-1">Clé de Sécurité</label>
<a class="text-[10px] font-label uppercase tracking-wider text-primary-fixed-dim hover:text-primary transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-md py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-300 font-body text-sm" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3 py-2">
<input class="w-4 h-4 rounded border-outline-variant/20 bg-surface-container-lowest text-primary-container focus:ring-primary-container focus:ring-offset-background cursor-pointer" id="remember" type="checkbox"/>
<label class="text-xs text-outline cursor-pointer select-none" for="remember">Maintenir la session active (24h)</label>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary-container text-on-primary-container font-headline font-bold rounded-md glow-pulse hover:bg-primary-container/90 transition-all flex items-center justify-center gap-2 group/btn" type="submit">
<span>Se Connecter</span>
<span class="material-symbols-outlined text-xl transition-transform group-hover/btn:translate-x-1">login</span>
</button>
</form>
<!-- Status Indicator -->
<div class="mt-8 flex items-center justify-between border-t border-outline-variant/10 pt-6">
<div class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
<span class="text-[10px] font-label text-outline uppercase tracking-widest">Système Opérationnel</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-label text-outline uppercase tracking-widest">v4.2.0-Elite</span>
</div>
</div>
</div>
<!-- Security Footer -->
<footer class="mt-12 text-center space-y-4">
<div class="flex justify-center gap-6 text-outline/40 text-[10px] font-label uppercase tracking-[0.15em]">
<span class="hover:text-primary-fixed-dim transition-colors cursor-pointer">Privacy Protocol</span>
<span class="hover:text-primary-fixed-dim transition-colors cursor-pointer">SLA Agreement</span>
<span class="hover:text-primary-fixed-dim transition-colors cursor-pointer">Global Nodes</span>
</div>
<p class="text-outline/30 text-[11px] font-body">One Pips © 2024 - Système de trading propriétaire.</p>
</footer>
</main>
<!-- Atmospheric Overlay -->
<div class="fixed inset-0 pointer-events-none mix-blend-overlay opacity-20">
<div class="w-full h-full bg-[radial-gradient(circle_at_50%_50%,_#1f1f23_0%,_transparent_100%)]"></div>
</div>
<script>
        // Simple micro-interactions for the login flow
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Loading state simulation
            btn.disabled = true;
            btn.classList.remove('glow-pulse');
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Validation...</span>
            `;

            // Mimic a network delay
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span>Accès Autorisé</span>
                `;
                btn.classList.add('bg-green-600');
                
                // Add a subtle ripple effect for success
                const ripple = document.createElement('div');
                ripple.className = 'fixed inset-0 z-[100] bg-primary-container/20 backdrop-blur-sm transition-opacity duration-1000 opacity-0';
                document.body.appendChild(ripple);
                setTimeout(() => ripple.classList.remove('opacity-0'), 10);
            }, 1800);
        });

        // Add visual reaction on input focus
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('translate-x-1');
                input.parentElement.parentElement.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('translate-x-1');
            });
        });
    </script>
</body></html>
